<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Navy Tech Background covering full canvas for safe zone mask -->
    <linearGradient id="bgGradMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <!-- Vibrant Left Wing Gradient (Cyan to Electric Blue) -->
    <linearGradient id="leftWingM" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Vibrant Right Wing Gradient (Deep Blue to Royal Violet Blue) -->
    <linearGradient id="rightWingM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Dynamic High-Tech Crossbar Beam Gradient -->
    <linearGradient id="beamGradM" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Square (Android maskable requirement: 0 margin bleed) -->
  <rect width="512" height="512" fill="url(#bgGradMaskable)" />

  <!-- Scaled content centered within the 80% safe circle zone (scale ~0.78 around center 256, 256) -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Stylized Abstract Letter 'A' -->
    <g id="brandMarkMaskable">
      <path
        d="M256 92
           L212 92
           C202 92 193 98 188 107
           L96 384
           C92 396 101 408 114 408
           L172 408
           C182 408 191 402 195 392
           L234 290
           L286 290
           L256 92 Z"
        fill="url(#leftWingM)"
      />

      <path
        d="M256 92
           L300 92
           C310 92 319 98 324 107
           L416 384
           C420 396 411 408 398 408
           L340 408
           C330 408 321 402 317 392
           L286 290
           L234 290
           L256 92 Z"
        fill="url(#rightWingM)"
      />

      <polygon
        points="174,310 338,310 324,264 188,264"
        fill="url(#beamGradM)"
      />

      <polygon
        points="256,156 220,244 292,244"
        fill="#070B14"
        opacity="0.95"
      />

      <polygon
        points="256,92 270,140 242,140"
        fill="#38BDF8"
        opacity="0.8"
      />
    </g>
  </g>
</svg>
